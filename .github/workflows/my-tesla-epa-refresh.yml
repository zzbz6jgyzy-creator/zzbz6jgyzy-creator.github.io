name: Refresh My Tesla EPA references
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: my-tesla-epa-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate the public government snapshot
        run: |
          python scripts/refresh-my-tesla-epa.py
          node --test tests/my-tesla.test.mjs
      - name: Commit only the reference snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/my-tesla-epa.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Tesla EPA certification references.'
            git pull --rebase
            git push
          fi
