name: Prepare attributed Earth and space assets
on:
  pull_request:
    paths: ['scripts/build-cosmos-assets.py', '.github/workflows/cosmos-assets-bootstrap.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == 'codex/earth-to-milky-way' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/earth-to-milky-way
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==11.3.0
      - name: Build real source textures, stellar catalogue and pinned ephemeris library
        run: python3 -u scripts/build-cosmos-assets.py --weather-probe
      - name: Commit generated assets only to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cosmos vendor/astronomy
          git diff --cached --quiet && exit 0
          git commit -m 'Vendor attributed Earth, Moon, planet and stellar source assets'
          git push origin HEAD:codex/earth-to-milky-way
