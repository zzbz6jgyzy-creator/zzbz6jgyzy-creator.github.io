name: Snapshot Tesla updates

on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-push-main
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pull Teslascope software list
        run: python3 scripts/snapshot-updates.py --out updates-live.json
      - name: Pull TeslaFi shares + Teslascope recent feed
        # The script fetches TeslaFi at most every ~105 minutes, judged from the saved fetch time (scheduled runs arrive
        # at irregular intervals, so the clock is no guide). A manual run forces it. Keeps old data if a source fails.
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python3 scripts/snapshot-extras.py --force || true
          else
            python3 scripts/snapshot-extras.py || true
          fi
      - name: Commit if firmware snapshot changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates-live.json
          node scripts/sd-intel.js || true
          node scripts/build-home.js --trackers-only || true
          git add data/intelligence index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Tesla software update snapshot."
            python3 scripts/build-updates-history.py data/updates-history.json
            git add data/updates-history.json
            git commit --amend --no-edit
          fi
          node scripts/build-tracker-snapshots.mjs --page updates
          git add data/updates-extras.json updates.html
          if git diff --cached --quiet && git diff --quiet origin/main HEAD; then
            echo "No firmware change"
          else
            git diff --cached --quiet || git commit -m "Refresh Tesla software extras (TeslaFi, Teslascope feed)."
            sh scripts/ci-push-retry.sh
          fi
