name: Snapshot Tesla updates

on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull Teslascope software list
        run: python3 scripts/snapshot-updates.py --out updates-live.json
      - name: Commit if firmware snapshot changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates-live.json
          if git diff --cached --quiet; then
            echo "No firmware change"
          else
            git commit -m "Refresh Tesla software update snapshot."
            git push
          fi
