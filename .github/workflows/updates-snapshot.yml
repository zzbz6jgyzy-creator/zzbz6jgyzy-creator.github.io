name: Snapshot Tesla updates

on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pull Teslascope software list
        run: python3 scripts/snapshot-updates.py --out updates-live.json
      - name: Pull TeslaFi shares + Teslascope recent feed
        # TeslaFi every 2 hours (polite), Teslascope feed every run. Keeps old data if a source blocks us.
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || { [ $(( 10#$(date -u +%H) % 2 )) -eq 0 ] && [ $(( 10#$(date -u +%M) )) -lt 35 ]; }; then
            python3 scripts/snapshot-extras.py || true
          else
            python3 scripts/snapshot-extras.py --skip-teslafi || true
          fi
      - name: Commit if firmware snapshot changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates-live.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Tesla software update snapshot."
            python3 scripts/build-updates-history.py data/updates-history.json
            git add data/updates-history.json
            git commit --amend --no-edit
          fi
          git add data/updates-extras.json
          if git diff --cached --quiet && git diff --quiet origin/main HEAD; then
            echo "No firmware change"
          else
            git diff --cached --quiet || git commit -m "Refresh Tesla software extras (TeslaFi, Teslascope feed)."
            git pull --rebase
            git push
          fi
      - name: Ping per-car mail scan
        env:
          MAIL_SCAN_SECRET: ${{ secrets.MAIL_SCAN_SECRET }}
        run: |
          if [ -z "$MAIL_SCAN_SECRET" ]; then
            echo "No MAIL_SCAN_SECRET; scan hook not armed"
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $MAIL_SCAN_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"source":"updates-snapshot"}' \
            https://sd-mail.superchargeddaily.workers.dev/scan \
            || echo "sd-mail Worker not live yet"
