name: Grok field guide checks
on:
  pull_request:
    paths:
      - 'grok.html'
      - 'grok-studio*'
      - 'data/grok-studio.json'
      - 'data/articles.json'
      - 'data/pages.json'
      - 'scripts/build-grok-studio.mjs'
      - 'scripts/build-noscript.mjs'
      - 'scripts/build-js.mjs'
      - 'scripts/inject-js-bundles.py'
      - 'scripts/js-bundles.json'
      - 'tests/grok-studio*'
      - '.github/workflows/grok-studio-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grok-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification tools
        run: |
          npm install --no-save --no-package-lock esbuild@0.25.12
          python -m pip install playwright==1.62.0
      - name: Check sources, estimates, saved preferences and generated output
        run: |
          node --test tests/grok-studio.test.mjs
          node scripts/build-grok-studio.mjs
          node scripts/build-js.mjs
          python scripts/inject-js-bundles.py
          sh scripts/ci-generated-ownership.sh -- grok.html data/pages.json assets/js
      - name: Check responsive layouts, learning progress and interactive tools
        run: CHROMIUM_EXECUTABLE="$(command -v google-chrome)" python tests/grok-studio-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grok-studio-previews
          path: /tmp/grok-studio
