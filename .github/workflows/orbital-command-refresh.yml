name: Refresh Orbital Command GP snapshot

on:
  schedule:
    # 15 minutes after the Starlink job (01:25 / 09:25 / 17:25). Few times a day.
    - cron: "40 1,9,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbital-command-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch CelesTrak GP → data/orbital-command
        continue-on-error: true
        run: python3 scripts/build-orbital-command-gp.py
      - name: Commit snapshot if it changed
        run: |
          if git diff --quiet -- data/orbital-command; then
            echo "No orbital-command snapshot change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orbital-command
          git commit -m "Refresh Orbital Command CelesTrak snapshot."
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
