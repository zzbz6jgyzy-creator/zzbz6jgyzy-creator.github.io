name: Model 3 studio checks
on:
  pull_request:
    paths:
      - 'model3-*'
      - 'data/model3-studio.json'
      - 'data/pages.json'
      - 'scripts/build-model3-studio.mjs'
      - 'scripts/js-bundles.json'
      - 'scripts/build-noscript.mjs'
      - 'tests/model3-studio*'
      - '.github/workflows/model3-studio-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification tools
        run: |
          npm install --no-save --no-package-lock esbuild@0.25.12
          python -m pip install playwright==1.62.0
      - name: Verify references, calculations and generated output
        run: |
          node --test tests/model3-studio.test.mjs
          node scripts/build-model3-studio.mjs
          node scripts/build-js.mjs
          python scripts/inject-js-bundles.py
          git diff --exit-code -- model3-explorer.html model3-parts.js data/pages.json assets/js
      - name: Verify responsive controls, real WebGL and fallback states
        run: CHROMIUM_EXECUTABLE="$(command -v google-chrome)" python tests/model3-studio-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3-studio-previews
          path: /tmp/model3-studio
