name: Snapshot news

on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull Google News RSS
        run: python3 scripts/snapshot-news.py --out news-data.json
      - name: Rebuild articles index
        run: python3 scripts/build-articles.py
      - name: Intelligence engine snapshot
        run: node scripts/sd-intel.js
      - name: Pre-render homepage fallback HTML
        run: node scripts/newsletter-latest.js || true; node scripts/build-home.js && node scripts/build-tesla-overview.mjs
      - name: Commit if headlines changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tesla-overview.json news-data.json data/articles.json data/intelligence index.html dispatch/*.html grow.js scripts/build-home.js *.html guides reviews
          if git diff --cached --quiet; then
            echo "No headline change"
          else
            git commit -m "Refresh today’s Tesla, SpaceX and Grok headlines."
            git push
          fi
