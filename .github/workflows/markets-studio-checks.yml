name: Markets desk checks
on:
  pull_request:
    paths:
      - 'tsla.html'
      - 'markets-studio*'
      - 'data/markets*'
      - 'data/articles.json'
      - 'data/calendar-studio.json'
      - 'data/pages.json'
      - 'scripts/build-markets-studio.mjs'
      - 'scripts/js-bundles.json'
      - 'tests/markets-studio*'
      - '.github/workflows/markets-studio-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  markets-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification tools
        run: |
          npm install --no-save --no-package-lock esbuild@0.25.12
          python -m pip install playwright==1.62.0
      - name: Check source figures, calculations and deterministic output
        run: |
          node --test tests/markets-studio.test.mjs
          node scripts/build-markets-studio.mjs
          node scripts/build-js.mjs
          python scripts/inject-js-bundles.py
          sh scripts/ci-generated-ownership.sh -- tsla.html data/markets-financials.csv data/pages.json assets/js
      - name: Responsive and interaction checks
        run: CHROMIUM_EXECUTABLE="$(command -v google-chrome)" python tests/markets-studio-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: markets-studio-previews
          path: /tmp/markets-studio
