name: Design preview checks
on:
  pull_request:
    paths:
      - 'ds.css'
      - 'ds-preview.css'
      - 'ds-components.js'
      - 'preview/**'
      - 'scripts/build-design-preview.mjs'
      - 'scripts/sync-nav.py'
      - 'scripts/inject-js-bundles.py'
      - 'scripts/check-site-integrity.py'
      - 'index.html'
      - 'home-v2.js'
      - 'home-v2.css'
      - 'home-studio.css'
      - 'home-studio.js'
      - 'scripts/build-home.js'
      - 'tests/design-preview*'
      - '.github/workflows/design-preview*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser tools
        run: python -m pip install playwright==1.62.0
      - name: Rebuild the live homepage, then the previews from it
        run: |
          node scripts/build-home.js
          node scripts/build-design-preview.mjs
      - name: Renderers, token contrast, preview structure and exclusions
        run: node --test tests/design-preview.test.mjs
      - name: News-first acceptance checks in a browser (320-1440, light and dark)
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          PREVIEW_SHOTS: /tmp/design-preview
        run: python tests/design-preview-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-preview-screenshots
          path: /tmp/design-preview
