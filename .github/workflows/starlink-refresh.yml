name: Refresh Starlink tracker

on:
  schedule:
    - cron: "25 5,17 * * *"   # twice a day, 06:25 and 18:25 Dublin (summer time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starlink-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: McDowell counts -> starlink-live.js
        run: python3 scripts/build-starlink-stats.py
      - name: CelesTrak orbits + GCAT buses -> starlink-gp.js
        run: python3 scripts/build-starlink-gp.py
      - name: Bump cache-busting tags and commit if data changed
        run: |
          if git diff --quiet -- starlink-live.js starlink-gp.js; then
            echo "No Starlink data change"; exit 0
          fi
          V=$(date -u +%Y%m%d%H%M)
          sed -i -E "s#(/starlink-(live|gp)\.js\?v=)[0-9]+#\1$V#g" starlink.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add starlink-live.js starlink-gp.js starlink.html
          git commit -m "Refresh Starlink counts and orbits."
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
