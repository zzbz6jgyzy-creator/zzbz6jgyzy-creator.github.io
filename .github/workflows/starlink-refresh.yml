name: Refresh Starlink tracker

on:
  schedule:
    # Every 8 hours. Feeds the tracker globe and the identify catalog.
    - cron: "25 1,9,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-push-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: McDowell counts -> starlink-live.js
        run: python3 scripts/build-starlink-stats.py
      - name: CelesTrak orbits + GCAT buses -> starlink-gp.js and data/starlink.json
        # CelesTrak sometimes refuses GitHub's runners; counts still refresh if it does.
        # The browser never calls CelesTrak — only this job does.
        continue-on-error: true
        run: python3 scripts/build-starlink-gp.py
      - name: Seed identify catalog from baked GP if CelesTrak was skipped
        run: |
          if [ ! -s data/starlink.json ]; then
            python3 scripts/export-starlink-catalog.py
          fi
      - name: Bump cache-busting tags and commit if data changed
        run: |
          if git diff --quiet -- starlink-live.js starlink-gp.js data/starlink.json; then
            echo "No Starlink data change"; exit 0
          fi
          V=$(date -u +%Y%m%d%H%M)
          node scripts/build-starlink-observatory.mjs
          sed -i -E "s#(/starlink-gp\.js\?v=)[0-9]+#\1$V#g" starlink.html
          sed -i -E "s#(STARLINK_CATALOG = \"/data/starlink.json\?v=)[0-9]+#\1$V#" starlink-identify.js
          node scripts/build-home.js || echo "build-home skipped"
          sh scripts/rebuild-js.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add starlink-live.js starlink-gp.js data/starlink.json data/starlink-history.json data/starlink-observatory.json starlink.html starlink-identify.js index.html grok.html
          git add -u -- assets/js
          git commit -m "Refresh Starlink counts, orbits and identify catalog."
          sh scripts/ci-push-retry.sh
