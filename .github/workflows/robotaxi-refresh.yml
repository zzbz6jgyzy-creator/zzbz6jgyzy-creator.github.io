name: Refresh Texas Cybercab and Robotaxi counts

on:
  schedule:
    - cron: "35 5,17 * * *"   # twice a day, 06:35 and 18:35 Dublin (summer time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robotaxi-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Texas Robotaxi Database -> data/robotaxi-tx.json
        run: python3 scripts/build-robotaxi-tx.py
      - name: Service areas + state fleet -> data/robotaxi-areas*.json, data/robotaxi-fleet.json
        run: python3 scripts/build-robotaxi-cities.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/robotaxi-tx.json data/robotaxi-areas.geojson data/robotaxi-areas-history.json data/robotaxi-fleet.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/robotaxi-tx.json data/robotaxi-areas.geojson data/robotaxi-areas-history.json data/robotaxi-fleet.json
          git commit -m "Refresh Cybercab/Robotaxi counts and service areas."
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
