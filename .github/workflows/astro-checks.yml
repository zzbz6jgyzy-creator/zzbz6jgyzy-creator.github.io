name: astro-checks

# Builds the Astro packaging layer and proves it serves what the repo root serves. Does not deploy anything.
on:
  pull_request:
    paths: ['astro/**', 'content/dispatch/**', 'scripts/render-article.py', 'tests/test_astro_scaffold.py', '.github/workflows/astro-checks.yml']
  push:
    branches: [main]
    paths: ['astro/**', 'content/dispatch/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: astro/package-lock.json
      - run: python3 tests/test_astro_scaffold.py
      - run: npm ci
        working-directory: astro
      - run: npm run build
        working-directory: astro
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: npm run parity
        working-directory: astro
      # Astro's Dispatch collection and scripts/render-article.py must accept and refuse the same front matter.
      - run: node scripts/check-md-parity.mjs
        working-directory: astro
      - run: node scripts/check-content-schema.mjs
        working-directory: astro
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
