name: Pre-render homepage + related stories

on:
  push:
    branches: [main]
    paths:
      - dispatch.html
      - 'dispatch/**'
      - scripts/build-articles.py
      - starship-data.js
      - fsd-europe-data.js
      - cybercab-data.js
      - starlink-live.js
      - updates-live.json
      - news-data.json
      - data/events.json
      - live-data.json
      - data/articles.json
      - scripts/build-home.js
      - scripts/build-seo.py
      - scripts/build-images.mjs
      - scripts/build-wallpaper-thumbs.mjs
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Articles index + related stories
        run: python3 scripts/build-articles.py
      - name: Intelligence engine snapshot
        run: node scripts/sd-intel.js
      - name: Rebuild static homepage fallbacks
        run: node scripts/build-home.js && node scripts/build-noscript.mjs
      - name: Responsive AVIF/WebP images (build-images.mjs)
        run: |
          npm i --no-save --no-package-lock sharp@0.33 >/dev/null 2>&1 || true
          node scripts/build-images.mjs || echo "image build skipped"
          node scripts/build-wallpaper-thumbs.mjs || echo "wallpaper thumbs skipped"
      - name: NewsArticle structured data + sitemap
        run: python3 scripts/build-seo.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tesla.html spacex.html data/articles.json data/intelligence dispatch/*.html sitemap.xml *.html guides reviews assets
          if git diff --cached --quiet; then echo "No change"; else
            git commit -m "Pre-render homepage headlines, Dispatch and tracker numbers."
            git pull --rebase && git push
          fi
      - name: IndexNow ping (after Pages deploy)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sleep 90
          python3 scripts/indexnow-ping.py --since "${{ github.event.before || 'HEAD~1' }}" || true
