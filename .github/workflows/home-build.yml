name: Pre-render homepage + related stories

on:
  push:
    branches: [main]
    paths:
      - dispatch.html
      - 'dispatch/**'
      - scripts/build-articles.py
      - scripts/build-wayfinding.py
      - wayfinding.css
      - starship-data.js
      - starship-lab-data.js
      - starship-studio-model.js
      - starship-studio-view.js
      - scripts/build-starship-studio.mjs
      - fsd-europe-data.js
      - data/fsd-europe.json
      - scripts/build-fsd-europe.mjs
      - cybercab-data.js
      - starlink-live.js
      - data/starlink.json
      - data/starlink-history.json
      - scripts/build-starlink-observatory.mjs
      - updates-live.json
      - news-data.json
      - data/news-studio-guide.json
      - data/model3-studio.json
      - model3-studio.css
      - scripts/build-model3-studio.mjs
      - news-studio.css
      - scripts/build-news-studio.mjs
      - data/events.json
      - data/launches.json
      - scripts/build-calendar-studio.mjs
      - calendar-studio.css
      - launch-viewing.css
      - scripts/build-launch-viewing.mjs
      - data/viewing/world.json
      - data/robotaxi-tx.json
      - 'data/robotaxi-*'
      - 'data/updates-*.json'
      - live-data.json
      - data/fsd-global.json
      - fsd-global.css
      - scripts/build-fsd-global.mjs
      - data/grok-studio.json
      - grok-studio.css
      - scripts/build-grok-studio.mjs
      - data/promises.json
      - data/promise-studio-guide.json
      - promise-studio.css
      - scripts/build-promise-studio.mjs
      - data/owners-club-guide.json
      - owners-club.css
      - scripts/build-owners-club.mjs
      - data/markets-studio.json
      - markets-studio.css
      - scripts/build-markets-studio.mjs
      - data/production-studio.json
      - production-studio.css
      - scripts/build-production-studio.mjs
      - data/production.json
      - tesla-overview.css
      - scripts/build-spacex-studio.mjs
      - data/spacex-studio.json
      - spacex-studio.css
      - scripts/build-tesla-overview.mjs
      - data/articles.json
      - scripts/build-home.js
      - scripts/build-personal-home.mjs
      - personal-home.css
      - personal-model.js
      - personal-home.js
      - scripts/build-autonomy-evidence.mjs
      - data/autonomy-evidence.json
      - autonomy-evidence.css
      - scripts/build-reviews-studio.mjs
      - data/reviews-studio.json
      - reviews-studio.css
      - 'reviews/**'
      - scripts/build-buying-studio.mjs
      - data/buying-studio.json
      - buying-studio.css
      - scripts/build-noscript.mjs
      - scripts/build-tracker-snapshots.mjs
      - scripts/build-js.mjs
      - scripts/inject-js-bundles.py
      - scripts/js-bundles.json
      - scripts/rebuild-js.sh
      - scripts/ci-push-retry.sh
      - scripts/build-seo.py
      - scripts/build-feed.py
      - scripts/seo_lib.py
      - scripts/seo-titles.json
      - scripts/editorial-dates.py
      - scripts/generate-og.py
      - scripts/build-trust-pages.py
      - scripts/build-explainers.py
      - scripts/lesson-graphics.py
      - data/explainers.json
      - explainers.css
      - explainers.html
      - 'explainers/**'
      - scripts/editorial-dates.py
      - scripts/build-images.mjs
      - scripts/build-wallpaper-thumbs.mjs
      - '*.js'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Articles index + related stories
        run: python3 scripts/build-articles.py
      - name: Intelligence engine snapshot
        run: node scripts/sd-intel.js
      - name: Newsletter latest-issue link (public Beehiiv sitemap; keeps link on failure)
        run: node scripts/newsletter-latest.js || true
      - name: Refresh newsletter signup blocks (slug + issue count)
        run: python3 scripts/inject_newsletter.py
      - name: Rebuild static homepage fallbacks
        run: node scripts/build-home.js && node scripts/build-noscript.mjs && node scripts/build-starlink-observatory.mjs
      - name: Responsive AVIF/WebP images (build-images.mjs)
        run: |
          npm i --no-save --no-package-lock sharp@0.33 >/dev/null 2>&1 || true
          node scripts/build-images.mjs || echo "image build skipped"
          node scripts/build-wallpaper-thumbs.mjs || echo "wallpaper thumbs skipped"
      - name: Refresh SpaceX hub after responsive image generation
        run: node scripts/build-spacex-studio.mjs
      - name: Bundle first-party JS
        run: sh scripts/rebuild-js.sh
      - name: Rebuild visual explainer hub and lessons
        run: |
          python3 scripts/build-explainers.py
          python3 scripts/inject-js-bundles.py
      - name: Rebuild saved personal-home preview
        run: node scripts/build-personal-home.mjs
      - name: Trust pages, OG cards, NewsArticle structured data, sitemap and RSS
        run: |
          python3 scripts/build-trust-pages.py
          python3 scripts/generate-og.py
          python3 scripts/build-seo.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- templates/starlink-sky.html 2>/dev/null || true
          git add data/starlink-observatory.json data/markets-financials.csv data/production.csv data/tesla-overview.json data/launch-viewing.json data/calendar-studio.json data/calendar.ics data/starship-studio.json data/mobility-snapshot.json cybercab-cities fsd-europe-data.js fsd-data.js data/fsd-europe.json fsd-europe grow.js grow.css newsletter.js newsletter-cta.js nav-pill.js scripts/build-home.js scripts/inject_newsletter.py scripts/newsletter-latest.js index.html tesla.html spacex.html data/articles.json data/pages.json data/newsletter-latest.json data/intelligence dispatch/*.html sitemap.xml sitemap-news.xml feed.xml robots.txt *.html guides reviews assets explainers
          if git diff --cached --quiet; then echo "No change"; else
            git commit -m "Pre-render homepage headlines, Dispatch and tracker numbers."
            sh scripts/ci-push-retry.sh
          fi
      - name: IndexNow ping (after Pages deploy)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sleep 90
          python3 scripts/indexnow-ping.py --since "${{ github.event.before || 'HEAD~1' }}" || true
