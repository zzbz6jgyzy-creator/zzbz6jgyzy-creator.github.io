name: Homepage and article wayfinding checks
on:
  pull_request:
    paths: ['index.html', 'dispatch/**', 'members.js', 'wayfinding.css', 'scripts/build-wayfinding.py', 'scripts/build-articles.py', 'tests/*wayfinding*', '.github/workflows/wayfinding-checks.yml']
  push:
    branches: [main]
    paths: ['index.html', 'dispatch/**', 'members.js', 'wayfinding.css', 'scripts/build-wayfinding.py', 'scripts/build-articles.py', 'tests/*wayfinding*', '.github/workflows/wayfinding-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/test_wayfinding.py
      - run: python3 scripts/build-wayfinding.py --check
      - name: Native navigation and discussion journeys (local mocks)
        run: |
          python3 -m pip install playwright==1.62.0
          CHROMIUM_PATH="$(command -v google-chrome)" python3 tests/wayfinding-browser.py
