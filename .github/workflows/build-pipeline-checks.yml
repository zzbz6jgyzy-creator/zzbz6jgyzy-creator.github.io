name: Build pipeline regression checks

on:
  pull_request:
    paths:
      - scripts/build-js.mjs
      - scripts/js-bundles.json
      - scripts/snapshot-updates.py
      - assets/js/manifest.json
      - tests/js-bundle-build.test.mjs
      - tests/test_software_import.py
      - .github/workflows/build-pipeline-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned minifier
        run: npm install --no-save --no-package-lock esbuild@0.25.12
      - name: Reproduce bundle build and concurrent publisher regression
        run: node --test tests/js-bundle-build.test.mjs
      - name: Check software importer year rollover and saved-data retention
        run: python3 tests/test_software_import.py
