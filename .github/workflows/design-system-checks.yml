name: Design system checks
on:
  pull_request:
    paths:
      - 'ds.css'
      - 'ds-components.js'
      - 'scripts/ds-pages.mjs'
      - 'scripts/sync-nav.py'
      - 'scripts/nav.json'
      - 'scripts/inject-js-bundles.py'
      - 'scripts/check-site-integrity.py'
      - 'index.html'
      - 'dispatch.html'
      - 'news.html'
      - 'tesla.html'
      - 'spacex.html'
      - 'grok.html'
      - 'fsd-tracker.html'
      - 'starship.html'
      - 'cybercab.html'
      - 'calendar.html'
      - 'starlink.html'
      - 'production.html'
      - 'dispatch/tesla-cybercab-dallas-launch.html'
      - 'dispatch/starship-every-flight-1-to-15.html'
      - 'dispatch/spacex-q3-2026-results.html'
      - 'home-v2.js'
      - 'home-v2.css'
      - 'home-studio.css'
      - 'home-studio.js'
      - 'scripts/build-home.js'
      - 'tests/design-system.test.mjs'
      - 'tests/design-acceptance-browser.py'
      - '.github/workflows/design-system-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser tools
        run: python -m pip install playwright==1.62.0
      - name: Rebuild the live homepage
        run: node scripts/build-home.js
      - name: Renderers, token contrast and news-first page structure
        run: node --test tests/design-system.test.mjs
      - name: News-first acceptance checks in a browser (320-1440, light and dark)
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          DESIGN_SHOTS: /tmp/design-acceptance
        run: python tests/design-acceptance-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-acceptance-screenshots
          path: /tmp/design-acceptance
