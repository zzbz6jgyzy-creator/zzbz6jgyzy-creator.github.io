name: Member permissions and integration checks
on:
  pull_request:
    paths: ['members*', 'community.html', 'supabase/**', 'tests/*members*', 'scripts/inject-members.py', 'scripts/build-seo.py', 'scripts/inject-js-bundles.py', '.github/workflows/members-checks.yml']
  push:
    branches: [main]
    paths: ['members*', 'community.html', 'supabase/**', 'tests/*members*', 'scripts/inject-members.py', 'scripts/build-seo.py', 'scripts/inject-js-bundles.py', '.github/workflows/members-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm i --no-save --no-package-lock --ignore-scripts @electric-sql/pglite@0.5.11
      - run: node tests/members-db.mjs
      - run: node tests/members-return.mjs
      - run: python3 tests/test_members_injection.py
      - run: node --check members.js
      - name: Browser regression checks (mocked accounts, no live writes)
        run: |
          python3 -m pip install playwright==1.62.0
          CHROMIUM_PATH="$(command -v google-chrome)" python3 tests/members-browser.py
