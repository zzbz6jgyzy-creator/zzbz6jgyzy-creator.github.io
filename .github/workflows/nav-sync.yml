name: Sync pill menu
on:
  push:
    branches: [main]
    paths: ["**.html", "scripts/nav.json", "scripts/sync-nav.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: nav-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync-nav.py
      - name: Commit if any page drifted
        run: |
          git diff --quiet && exit 0
          git config user.name "zzbz6jgyzy-creator"; git config user.email "alexrickard86@gmail.com"
          git commit -am "Sync pill menu from scripts/nav.json"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1
