name: Optimus studio checks
on:
  pull_request:
    paths:
      - 'optimus.html'
      - 'optimus*.js'
      - 'optimus-studio.css'
      - 'optimus-viewer.html'
      - 'optimus-viewer.css'
      - 'optimus-parts.js'
      - 'assets/3d/optimus*'
      - 'tests/optimus-3d-browser.py'
      - 'data/optimus-studio.json'
      - 'assets/optimus-studio/**'
      - 'scripts/build-optimus-studio.mjs'
      - 'scripts/optimus-art.mjs'
      - 'scripts/js-bundles.json'
      - 'scripts/build-seo.py'
      - 'tests/test_optimus_refresh.py'
      - 'tests/optimus-studio*'
      - '.github/workflows/optimus-studio-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test tools
        run: |
          npm install --no-save --no-package-lock esbuild@0.25.12
          python -m pip install playwright==1.62.0
      - name: Validate editorial data, media and reproducible builds
        run: |
          node --test tests/optimus-studio.test.mjs
          python tests/test_optimus_refresh.py
          node scripts/build-js.mjs
          python scripts/inject-js-bundles.py
          sh scripts/ci-generated-ownership.sh -- assets/js optimus.html optimus-parts.js
      - name: Responsive, accessible and fallback journeys
        run: CHROMIUM_PATH="$(command -v google-chrome)" python tests/optimus-studio-browser.py
      - name: 3D viewer with software WebGL
        run: CHROMIUM_PATH="$(command -v google-chrome)" python tests/optimus-3d-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimus-studio-previews
          path: /tmp/optimus-studio
