name: Cinematic Earth preview checks
on:
  pull_request:
    paths:
      - 'mission-control.html'
      - 'earth-*.js'
      - 'earth-*.css'
      - 'assets/earth/**'
      - 'tests/earth-live-model.test.mjs'
      - 'tests/earth-weather.test.mjs'
      - 'tests/cosmos-browser.py'
      - 'tests/earth-cosmos.test.mjs'
      - 'assets/cosmos/**'
      - 'vendor/astronomy/**'
      - 'vendor/three*'
      - 'vendor/three*/**'
      - 'scripts/js-bundles.json'
      - 'scripts/build-earth-assets.py'
      - 'scripts/build-cosmos-assets.py'
      - 'tests/earth-browser.py'
      - 'tests/earth-phone-browser.py'
      - '.github/workflows/earth-preview-checks.yml'
  workflow_dispatch:
concurrency:
  group: earth-explorer-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  earth-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, touch, failures, cosmos, phone]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser tooling
        run: |
          python3 -m pip install playwright==1.62.0 Pillow==11.3.0
          python3 -m playwright install ffmpeg
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify vendored NASA imagery, dimensions and checksums
        run: python3 scripts/build-earth-assets.py --check
      - name: Syntax and isolated viewer configuration
        run: |
          node --check earth-preview.js
          node --check earth-live-model.js
          node --check earth-weather.js
          node tests/earth-live-model.test.mjs
          node tests/earth-weather.test.mjs
          node tests/earth-cosmos.test.mjs
          node --check earth-cosmos.js
          node --check earth-cosmos-model.js
          python3 scripts/build-cosmos-assets.py --check
          node --check earth-renderer.js
          python3 -m py_compile tests/earth-browser.py tests/earth-phone-browser.py
          python3 -c 'import json; from pathlib import Path; assert "mission-control.html" in json.loads(Path("scripts/js-bundles.json").read_text())["skipPages"]'
      - name: Real WebGL, responsive controls, high resolution and fallback journeys
        env:
          EARTH_TEST_GROUP: ${{ matrix.device }}
        run: |
          if [ "$EARTH_TEST_GROUP" = cosmos ]; then
            CHROMIUM_PATH="$(command -v google-chrome)" timeout 1200s python3 -u tests/cosmos-browser.py
          elif [ "$EARTH_TEST_GROUP" = phone ]; then
            PHONE_SHOTS=/tmp/earth-preview CHROMIUM_PATH="$(command -v google-chrome)" timeout 1500s python3 -u tests/earth-phone-browser.py
          else
            CHROMIUM_PATH="$(command -v google-chrome)" timeout 1200s python3 -u tests/earth-browser.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-preview-screenshots-${{ matrix.device }}
          path: |
            /tmp/earth-preview/*.jpg
            /tmp/earth-preview/*.png
            /tmp/earth-preview/*results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-preview-film-${{ matrix.device }}
          path: |
            /tmp/earth-preview/earth-preview.mp4
            /tmp/earth-preview/cosmos-tour.mp4

