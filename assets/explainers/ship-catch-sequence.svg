<title id="scs-t">How a Ship catch is meant to work, in four steps</title>
<desc id="scs-d">Four panels. One: the Ship falls belly-first. Two: it flips upright. Three: it fires its engines beside the tower. Four: the tower arms close around it. Illustration, not to scale.</desc>
